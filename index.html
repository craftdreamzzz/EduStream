<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mehandi Learning Portal</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./assets/css/main.css">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
</head>
<body class="min-h-screen gradient-bg flex items-center justify-center p-4">
    
    <!-- Login Container -->
    <div class="w-full max-w-md">
        
        <!-- Logo & Title -->
        <div class="text-center mb-8 animate-slideUp" data-aos="fade-down">
            <div class="text-6xl mb-4 animate-float">🎨</div>
            <h1 class="text-4xl font-bold text-white mb-2" id="appTitle">CraftDreamzzz Learning</h1>
            <p class="text-white text-opacity-90" id="appTagline">Master the Art of Henna Design</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-8 animate-slideUp" data-aos="fade-up" data-aos-delay="200">
            
            <!-- Tab Switcher -->
            <div class="flex gap-2 mb-6 bg-gray-100 p-1 rounded-lg">
                <button 
                    id="studentTab" 
                    class="flex-1 py-2 px-4 rounded-lg font-semibold transition-all duration-300 bg-white shadow-md text-purple-600"
                    onclick="switchTab('student')">
                    Student Login
                </button>
                <button 
                    id="adminTab" 
                    class="flex-1 py-2 px-4 rounded-lg font-semibold transition-all duration-300 text-gray-600 hover:text-gray-900"
                    onclick="switchTab('admin')">
                    Admin
                </button>
            </div>

            <!-- Student Login Form -->
            <form id="studentLoginForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Username</label>
                    <input 
                        type="text" 
                        id="studentUsername" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Password</label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="studentPassword" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all"
                            placeholder="Enter your password"
                            required
                        >
                        <button 
                            type="button" 
                            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700"
                            onclick="togglePassword('studentPassword')"
                        >
                            👁️
                        </button>
                    </div>
                </div>

                <button 
                    type="submit" 
                    class="w-full bg-gradient-to-r from-purple-600 to-purple-800 text-white py-3 rounded-lg font-semibold hover:shadow-lg transform hover:scale-105 transition-all duration-300"
                >
                    Login to Dashboard
                </button>
            </form>

            <!-- Admin Login Form (Hidden by default) -->
            <form id="adminLoginForm" class="space-y-4 hidden">
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Admin Username</label>
                    <input 
                        type="text" 
                        id="adminUsername" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all"
                        placeholder="Enter admin username"
                        required
                    >
                </div>

                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Admin Password</label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="adminPassword" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all"
                            placeholder="Enter admin password"
                            required
                        >
                        <button 
                            type="button" 
                            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700"
                            onclick="togglePassword('adminPassword')"
                        >
                            👁️
                        </button>
                    </div>
                </div>

                <button 
                    type="submit" 
                    class="w-full bg-gradient-to-r from-red-600 to-red-800 text-white py-3 rounded-lg font-semibold hover:shadow-lg transform hover:scale-105 transition-all duration-300"
                >
                    Access Admin Panel
                </button>
            </form>

            <!-- Info Text -->
            <p class="text-center text-gray-500 text-sm mt-6">
                Don't have credentials? Contact admin
            </p>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6 text-white text-opacity-80 text-sm">
            <p id="footerText">© 2026 CraftDreamzzz Learning Portal. All rights reserved.</p>
            <p class="mt-2">
                <a href="mailto:craftdreamzzz@gmail.com" class="hover:text-white">📧 craftdreamzzz@gmail.com</a>
                <span class="mx-2">|</span>
                <a href="tel:+918277414796" class="hover:text-white">📞 +91 82774 14796</a>
            </p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/utils.js"></script>
    <script src="./assets/js/auth.js"></script>

    <script>
    // Load dynamic settings
    window.addEventListener('DOMContentLoaded', async () => {
            try {
                const settings = await API.getSettings();
                if (settings) {
                    document.getElementById('appTitle').textContent = settings.appName;
                    document.getElementById('appTagline').textContent = settings.tagline;
                    document.getElementById('footerText').textContent = `© 2026 ${settings.appName}. All rights reserved.`;
                }
            } catch (error) {
                console.log('Using default settings');
            }
        });
    </script>
    
    <script>
        // Initialize AOS
        AOS.init({
            duration: 800,
            once: true
        });

        // Tab Switching
        function switchTab(tab) {
            const studentTab = document.getElementById('studentTab');
            const adminTab = document.getElementById('adminTab');
            const studentForm = document.getElementById('studentLoginForm');
            const adminForm = document.getElementById('adminLoginForm');

            if (tab === 'student') {
                studentTab.classList.add('bg-white', 'shadow-md', 'text-purple-600');
                studentTab.classList.remove('text-gray-600');
                adminTab.classList.remove('bg-white', 'shadow-md', 'text-red-600');
                adminTab.classList.add('text-gray-600');
                studentForm.classList.remove('hidden');
                adminForm.classList.add('hidden');
            } else {
                adminTab.classList.add('bg-white', 'shadow-md', 'text-red-600');
                adminTab.classList.remove('text-gray-600');
                studentTab.classList.remove('bg-white', 'shadow-md', 'text-purple-600');
                studentTab.classList.add('text-gray-600');
                adminForm.classList.remove('hidden');
                studentForm.classList.add('hidden');
            }
        }

        // Toggle Password Visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        // Student Login Handler
        document.getElementById('studentLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('studentUsername').value.trim();
            const password = document.getElementById('studentPassword').value;
            
            await Auth.loginStudent(username, password);
        });

        // Admin Login Handler
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value;
            
            await Auth.loginAdmin(username, password);
        });

        // Check if already logged in
        window.addEventListener('DOMContentLoaded', () => {
            if (Auth.checkSession()) {
                const user = Auth.getCurrentUser();
                if (user) {
                    if (Auth.isAdmin) {
                        window.location.href = './admin/index.html';
                    } else {
                        window.location.href = './student/dashboard.html';
                    }
                }
            }
        });

        // Disable right-click (optional security measure)
        // document.addEventListener('contextmenu', (e) => e.preventDefault());
    </script>
</body>
</html>
