<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - CraftDreamzzz Learning Portal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
</head>
<body class="bg-gray-50 min-h-screen">
    
    <!-- Navigation Bar -->
    <nav class="bg-white shadow-lg sticky top-0 z-40">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <span class="text-3xl">🎨</span>
                    <div>
                        <h1 class="text-xl font-bold text-gray-800" id="portalName">CraftDreamzzz</h1>
                        <p class="text-sm text-gray-500" id="welcomeText">Loading...</p>
                    </div>
                </div>
                <button 
                    onclick="logout()" 
                    class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-lg font-semibold transition-all duration-300 transform hover:scale-105"
                >
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8">
        
        <!-- Dashboard Header -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            
            <!-- Course Info Card -->
            <div class="bg-white rounded-xl shadow-lg p-6 card-hover" data-aos="fade-up">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold text-gray-700">Your Course</h3>
                    <span class="text-3xl" id="courseIcon">🔧</span>
                </div>
                <p class="text-2xl font-bold text-purple-600" id="courseName">Loading...</p>
                <p class="text-sm text-gray-500 mt-2" id="courseDuration">Duration: --</p>
            </div>

            <!-- Validity Card -->
            <div class="bg-white rounded-xl shadow-lg p-6 card-hover" data-aos="fade-up" data-aos-delay="100">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold text-gray-700">Validity</h3>
                    <span class="text-3xl">📅</span>
                </div>
                <p class="text-2xl font-bold text-green-600" id="validityDate">Loading...</p>
                <p class="text-sm text-gray-500 mt-2" id="daysRemaining">-- days remaining</p>
            </div>

            <!-- Progress Card -->
            <div class="bg-white rounded-xl shadow-lg p-6 card-hover" data-aos="fade-up" data-aos-delay="200">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold text-gray-700">Progress</h3>
                    <span class="text-3xl">📊</span>
                </div>
                <p class="text-2xl font-bold text-blue-600" id="progressPercent">0%</p>
                <div class="progress-bar mt-3">
                    <div class="progress-fill" id="progressBar" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Next Video Alert -->
        <div id="nextVideoAlert" class="bg-gradient-to-r from-purple-500 to-purple-700 text-white rounded-xl p-6 mb-8 hidden" data-aos="fade-up">
            <div class="flex items-center space-x-4">
                <span class="text-4xl">🎬</span>
                <div class="flex-1">
                    <h3 class="text-xl font-bold">Next Video Unlocks Soon!</h3>
                    <p class="text-white text-opacity-90 mt-1" id="nextVideoInfo">Loading...</p>
                </div>
            </div>
        </div>

        <!-- Contact & Support Section -->
        <div class="bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-xl p-6 mb-8" data-aos="fade-up">
            <div class="flex items-center justify-between flex-wrap gap-4">
                <div>
                    <h3 class="text-xl font-bold mb-2">Need Help?</h3>
                    <p class="text-white text-opacity-90">Contact your instructor</p>
                </div>
                <div class="flex flex-wrap gap-3">
                    <a href="tel:+918277414796" class="bg-white text-purple-600 px-6 py-3 rounded-lg font-semibold hover:bg-purple-50 transition-all flex items-center space-x-2">
                        <span>📞</span>
                        <span id="contactPhone">Call Now</span>
                    </a>
                    <a href="https://wa.me/918277414796" target="_blank" class="bg-green-500 text-white px-6 py-3 rounded-lg font-semibold hover:bg-green-600 transition-all flex items-center space-x-2">
                        <span>💬</span>
                        <span>WhatsApp</span>
                    </a>
                    <a href="mailto:craftdreamzzz@gmail.com" class="bg-blue-500 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-600 transition-all flex items-center space-x-2">
                        <span>📧</span>
                        <span>Email</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- Video List Section -->
        <div class="bg-white rounded-xl shadow-lg p-6" data-aos="fade-up">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold text-gray-800">📺 Course Videos</h2>
                <div class="flex space-x-2">
                    <button onclick="filterVideos('all')" id="btnAll" class="px-4 py-2 rounded-lg bg-purple-600 text-white font-semibold">All</button>
                    <button onclick="filterVideos('unlocked')" id="btnUnlocked" class="px-4 py-2 rounded-lg bg-gray-200 text-gray-700 font-semibold">Unlocked</button>
                    <button onclick="filterVideos('locked')" id="btnLocked" class="px-4 py-2 rounded-lg bg-gray-200 text-gray-700 font-semibold">Locked</button>
                </div>
            </div>

            <!-- Loading Skeleton -->
            <div id="videosSkeleton" class="space-y-4">
                <div class="skeleton h-32 rounded-lg"></div>
                <div class="skeleton h-32 rounded-lg"></div>
                <div class="skeleton h-32 rounded-lg"></div>
            </div>

            <!-- Videos Container -->
            <div id="videosContainer" class="space-y-4 hidden"></div>

            <!-- No Videos Message -->
            <div id="noVideosMessage" class="text-center py-12 hidden">
                <span class="text-6xl">📹</span>
                <p class="text-xl text-gray-500 mt-4">No videos available yet</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/student.js"></script>
    
    <script>
        AOS.init({ duration: 800, once: true });

        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                Auth.logout();
            }
        }

        // Initialize dashboard
        window.addEventListener('DOMContentLoaded', async () => {
            // Check authentication
            if (!Auth.requireAuth()) return;

            const user = Auth.getCurrentUser();
            
            // Load settings and update UI
            try {
                const settings = await API.getSettings();
                if (settings) {
                    document.getElementById('portalName').textContent = settings.appName.split(' ')[0]; // First word
                    document.getElementById('contactPhone').textContent = settings.whatsapp;
                    
                    // Update contact links
                    document.querySelector('a[href^="tel:"]').href = `tel:${settings.whatsapp}`;
                    document.querySelector('a[href^="https://wa.me/"]').href = `https://wa.me/${settings.whatsapp.replace(/\D/g, '')}`;
                    document.querySelector('a[href^="mailto:"]').href = `mailto:${settings.email}`;
                }
            } catch (error) {
                console.log('Using default settings');
            }
            
            // Load dashboard data
            await StudentDashboard.init(user);
        });
    </script>
</body>
</html>
